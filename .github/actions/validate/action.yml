name: Validate one lane
description: Run an inventoried lane with isolated evidence, shared build caches and bounded cleanup
inputs:
  lane:
    description: Lane from scripts/test-acceptance.py
    required: true
runs:
  using: composite
  steps:
    - name: Identify toolchain and cache family
      id: build
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
      run: |
        xcodebuild -version
        swift --version
        plutil -lint RemoteFiles.xcodeproj/project.pbxproj
        toolchain=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
        family=ios
        if [[ "$LANE" == macos-openssh ]]; then family=macos; fi
        # One cache family per lane.
        echo "prefix=v3-xcode-$toolchain-${{ runner.arch }}-$family-$LANE" >> "$GITHUB_OUTPUT"
        echo "platform=v3-xcode-$toolchain-${{ runner.arch }}-$family" >> "$GITHUB_OUTPUT"
        echo "legacy=v2-xcode-$toolchain-${{ runner.arch }}-$family" >> "$GITHUB_OUTPUT"
    - name: Restore dependency and build caches
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ env.CI_CACHE }}
        key: ${{ steps.build.outputs.prefix }}-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}-${{ hashFiles('App/**', 'Sources/**', 'Tests/**', 'Vendor/**', 'RemoteFiles.xcodeproj/**') }}
        restore-keys: |
          ${{ steps.build.outputs.prefix }}-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}-
          ${{ steps.build.outputs.prefix }}-
          ${{ steps.build.outputs.platform }}-
          ${{ steps.build.outputs.legacy }}-
    - name: Create disposable iOS 27 simulator
      id: simulator
      if: inputs.lane != 'macos-openssh' && inputs.lane != 'release-device-compile'
      shell: bash
      run: |
        # Stays shut down: the runner boots it after a successful build, and hashing source
        # beside a booting simulator took 40 to 154 seconds in the VoiceOver lane.
        simulator=$(xcrun simctl create 'RemoteFiles CI' \
          com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro \
          com.apple.CoreSimulator.SimRuntime.iOS-27-0)
        echo "udid=$simulator" >> "$GITHUB_OUTPUT"
    - name: Run selected validation lane
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
      run: |
        simulator_options=()
        if [[ -n "$SIMULATOR_UDID" ]]; then simulator_options=(--simulator "$SIMULATOR_UDID" --boot-simulator); fi
        export REMOTEFILES_RUNNER_LAUNCHED_AT=$(date +%s)
        python3 -B scripts/test-acceptance.py --use-checkout --lane "$LANE" "${simulator_options[@]}" \
          --output "$EVIDENCE" --source-packages "$CI_CACHE/SourcePackages" \
          --swift-scratch "$CI_CACHE/SwiftBuild" --derived-data "$CI_CACHE/DerivedData" \
          --ci-compilation-cache "$CI_CACHE/CompilationCache"
    - name: Publish lane summary
      if: always()
      shell: bash
      run: |
        if [[ -f "$EVIDENCE/SUMMARY.md" ]]; then
          cat "$EVIDENCE/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
        elif [[ -f "$EVIDENCE/BLOCKER.txt" ]]; then
          cat "$EVIDENCE/BLOCKER.txt" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Remove disposable simulator
      if: always() && steps.simulator.outputs.udid != ''
      shell: bash
      env:
        SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
      run: |
        # Bound native shutdown separately so a stalled service cannot block evidence upload.
        python3 - <<'PYTHON'
        import os, subprocess
        simulator = os.environ["SIMULATOR_UDID"]
        for command in ("shutdown", "delete"):
            try:
                subprocess.run(["xcrun", "simctl", command, simulator], check=command == "delete", timeout=45)
            except subprocess.TimeoutExpired:
                print("Simulator " + command + " timed out", flush=True)
        PYTHON
    - name: Retain lane logs and result bundles
      id: evidence
      if: always()
      # A request to GitHub's artifact service timed out once after every UI journey had passed
      # and failed the lane. The next step tries again, and only that one can fail the job.
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: validation-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        path: |
          ${{ env.EVIDENCE }}/SUMMARY.md
          ${{ env.EVIDENCE }}/summary.json
          ${{ env.EVIDENCE }}/phase-timings.json
          ${{ env.EVIDENCE }}/BLOCKER.txt
          ${{ env.EVIDENCE }}/*.log
          ${{ env.EVIDENCE }}/*-xcresult-*.json
          ${{ env.EVIDENCE }}/source-manifest.json
          ${{ env.EVIDENCE }}/source-status.txt
          ${{ env.EVIDENCE }}/simulator-*.json
          ${{ env.EVIDENCE }}/*.xcresult
    - name: Retain lane logs and result bundles after a failed upload
      if: always() && steps.evidence.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: validation-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        overwrite: true
        path: |
          ${{ env.EVIDENCE }}/SUMMARY.md
          ${{ env.EVIDENCE }}/summary.json
          ${{ env.EVIDENCE }}/phase-timings.json
          ${{ env.EVIDENCE }}/BLOCKER.txt
          ${{ env.EVIDENCE }}/*.log
          ${{ env.EVIDENCE }}/*-xcresult-*.json
          ${{ env.EVIDENCE }}/source-manifest.json
          ${{ env.EVIDENCE }}/source-status.txt
          ${{ env.EVIDENCE }}/simulator-*.json
          ${{ env.EVIDENCE }}/*.xcresult
    - name: Save build progress from main even when tests fail
      # PR branches restore the latest main cache for their lane; only main publishes new entries.
      if: always() && !cancelled() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' && steps.cache.outputs.cache-primary-key != ''
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ env.CI_CACHE }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
