name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check generated Xcode project
        run: |
          python3 scripts/generate-project.py
          git diff --exit-code -- RemoteFiles.xcodeproj
      - name: Test runner failure and cleanup handling
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  acceptance:
    name: Xcode 27 acceptance
    needs: repository-checks
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      EVIDENCE: /private/tmp/remotefiles-acceptance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify toolchain and project
        run: |
          xcodebuild -version
          swift --version
          plutil -lint RemoteFiles.xcodeproj/project.pbxproj
          xcrun simctl list runtimes
      - name: Create and boot iOS 27 simulator
        id: simulator
        timeout-minutes: 10
        run: |
          simulator=$(xcrun simctl create 'RemoteFiles CI' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "udid=$simulator" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
      - name: Run all automated acceptance lanes
        run: |
          python3 -B scripts/test-acceptance.py \
            --simulator '${{ steps.simulator.outputs.udid }}' \
            --output "$EVIDENCE"
      - name: Publish acceptance summary
        if: always()
        run: |
          if [[ -f "$EVIDENCE/SUMMARY.md" ]]; then
            cat "$EVIDENCE/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f "$EVIDENCE/BLOCKER.txt" ]]; then
            cat "$EVIDENCE/BLOCKER.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove disposable simulator
        if: always() && steps.simulator.outputs.udid != ''
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID"
      # Upload evidence only; exclude build caches, source copies and SSH fixture keys.
      - name: Retain test logs and result bundles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ env.EVIDENCE }}/SUMMARY.md
            ${{ env.EVIDENCE }}/summary.json
            ${{ env.EVIDENCE }}/BLOCKER.txt
            ${{ env.EVIDENCE }}/*.log
            ${{ env.EVIDENCE }}/*-xcresult-*.json
            ${{ env.EVIDENCE }}/source-manifest.json
            ${{ env.EVIDENCE }}/source-status.txt
            ${{ env.EVIDENCE }}/simulator-*.json
            ${{ env.EVIDENCE }}/simulator.xcresult
            ${{ env.EVIDENCE }}/voiceover/voiceover.log
            ${{ env.EVIDENCE }}/voiceover/voiceover.xcresult
