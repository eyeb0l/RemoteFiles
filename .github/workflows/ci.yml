name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      full_acceptance:
        description: Run UI journeys, VoiceOver and Release compilation as well
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      quick: ${{ steps.scope.outputs.quick }}
      acceptance: ${{ steps.scope.outputs.acceptance }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check generated Xcode project
        run: |
          python3 scripts/generate-project.py
          git diff --exit-code -- RemoteFiles.xcodeproj
      - name: Test CI scope, inventories and runner cleanup
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Classify the complete change
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
          CI_FORCE_QUICK: ${{ github.event_name == 'workflow_dispatch' }}
          CI_FORCE_ACCEPTANCE: ${{ inputs.full_acceptance == true || contains(github.event.pull_request.labels.*.name, 'full-acceptance') }}
        run: python3 -B scripts/ci_scope.py
      - name: Check changed whitespace
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if [[ -n "$CI_BASE_SHA" && ! "$CI_BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$CI_BASE_SHA" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

  quick:
    name: Quick / ${{ matrix.lane }}
    needs: repository-checks
    if: needs.repository-checks.outputs.quick == 'true'
    runs-on: xcode-27
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [macos-openssh, simulator-core]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      EVIDENCE: /private/tmp/remotefiles-validation
      CI_CACHE: /private/tmp/remotefiles-ci-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate
        with:
          lane: ${{ matrix.lane }}

  acceptance:
    name: Acceptance / ${{ matrix.lane }}
    needs: [repository-checks, quick]
    if: needs.repository-checks.outputs.acceptance == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [simulator-ui, voiceover, release-device-compile]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      EVIDENCE: /private/tmp/remotefiles-validation
      CI_CACHE: /private/tmp/remotefiles-ci-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate
        with:
          lane: ${{ matrix.lane }}
