<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RemoteFiles icon appearances</title>
<style>
body { font: 16px system-ui; background: #eeeef3; color: #222; margin: 32px; }
main { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 32px; max-width: 900px; margin: auto; }
figure { margin: 0; text-align: center; }
img { width: 100%; max-width: 230px; }
figcaption { margin: 12px 0; }
@media (max-width:600px) { main { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 20px; } }
</style>
<main>
<figure><img src="Default.png" alt="Linked folder in Light appearance"><figcaption>Light</figcaption></figure>
<figure><img src="Dark.png" alt="Linked folder in Dark appearance"><figcaption>Dark</figcaption></figure>
<figure><img src="TintedLight.png" alt="Linked folder in light Tinted appearance"><figcaption>Tinted · Light</figcaption></figure>
<figure><img src="TintedDark.png" alt="Linked folder in dark Tinted appearance"><figcaption>Tinted · Dark</figcaption></figure>
<figure><img src="ClearLight.png" alt="Linked folder in light Clear appearance"><figcaption>Clear · Light</figcaption></figure>
<figure><img src="ClearDark.png" alt="Linked folder in dark Clear appearance"><figcaption>Clear · Dark</figcaption></figure>
</main>
